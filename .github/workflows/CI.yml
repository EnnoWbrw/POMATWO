nname: CI

on:
  push:
    branches:
    tags: ['*']
  pull_request:
    branches:
    tags: ['*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        os:
          - ubuntu-latest
          - windows-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      actions: write
      contents: read
      pull-requests: write
      statuses: write
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1

      - name: Run tests with coverage
        shell: julia --project=. --color=yes {0}
        run: |
          using Pkg
          Pkg.test(; coverage=true)

      - name: Generate LCOV report
        shell: julia --color=yes {0}
        run: |
          import Pkg
          Pkg.activate(; temp=true)
          Pkg.add("Coverage")
          using Coverage
          using Coverage.LCOV

          coverage = process_folder("src")
          LCOV.writefile("lcov.info", coverage)

          covered, total = get_summary(coverage)
          percentage = total == 0 ? 0.0 : round(100 * covered / total; digits=2)
          println("Coverage: $covered / $total lines ($percentage%)")

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: lcov.info
          format: lcov

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Remove pinned docs Manifest (if present)
        shell: julia --color=yes {0}
        run: |
          if isfile(joinpath("docs", "Manifest.toml"))
              @info "Removing docs/Manifest.toml to avoid stale pins"
              rm(joinpath("docs", "Manifest.toml"))
          end
      - name: Configure doc environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using POMATWO
          DocMeta.setdocmeta!(POMATWO, :DocTestSetup, :(using POMATWO); recursive=true)
          doctest(POMATWO)
